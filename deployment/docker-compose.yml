services:
  frontend:
    # This compose file lives in deployment/, so build contexts point up to the
    # sibling project directories at the repo root.
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@db:27017/dss?authSource=admin
    depends_on:
      - db

  db:
    image: mongo
    # No host port publish on purpose: only the backend talks to Mongo, and it reaches it
    # over the compose network at db:27017. Keeping 27017 off the host means the database
    # isn't exposed on the host's network surface. Add a temporary "ports" mapping locally
    # if you need to inspect the data with a Mongo client.
    environment:
      # Override via a .env file or shell env for anything beyond local use.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

