# =======================================================================
# MongoDB Connection Settings
# =======================================================================
# Host or full URI to the MongoDB instance.
# form: mongodb://<host>:<port>/<database>
#
# This localhost value is the LOCAL DEV default only -- a Mongo running on the developer's
# host, typically without authentication. Every deployment overrides it via the
# SPRING_DATA_MONGODB_URI environment variable with a credentialed URI: see
# deployment/docker-compose.yml and deployment/kubernetes/deployment.yaml, where Mongo
# runs with authentication enabled (MONGO_INITDB_ROOT_*) and the connection string carries
# the credentials. There is no unauthenticated fallback in a deployment -- the env var
# always supplies authenticated credentials, so nothing here needs to change to deploy.
spring.data.mongodb.uri=mongodb://localhost:27017/dss

# If MongoDB requires authentication, uncomment and set user/pass:
# spring.data.mongodb.username=
# spring.data.mongodb.password=

# =======================================================================
# Security
# =======================================================================
# This is an unauthenticated local demo tool: all endpoints are open and there
# is no login, user store, or token handling (see SecurityConfig). Do not expose
# it on an untrusted network.

# =======================================================================
# Simulation Configuration
# =======================================================================
# Number of threads in the shared scheduler pool. Used by various scheduling tasks,
# such as consensus timeouts, heartbeat broadcasts, etc..
simulation.schedulerThreadPoolSize=10

# Number of threads for worker pools handling node tasks.
simulation.workerThreadPoolSize=10

# Timeout (in milliseconds) for Multi-Paxos "prepare" phase.
# Leader nodes wait up to this value for promises before resetting.
simulation.multipaxosPrepareTimeoutMillis=5000

# If non-zero, overrides default quorum size for Multi-Paxos.
# Otherwise, quorum is (total_nodes / 2) + 1.
simulation.multipaxosQuorum=0

# Interval (in milliseconds) at which heartbeats are sent among nodes.
simulation.heartbeatIntervalMillis=1000

# Randomized election timeout range (in milliseconds) for Raft. Each node picks a
# random delay in this range before starting an election if it hasn't heard from a
# leader (or granted a vote) recently.
simulation.raftElectionTimeoutMinMillis=150
simulation.raftElectionTimeoutMaxMillis=300

# Interval at which a Raft leader sends heartbeats (empty AppendEntries). Kept well
# below the minimum election timeout so a healthy leader keeps followers from timing
# out, and so committed state propagates to followers promptly.
simulation.raftHeartbeatIntervalMillis=50

# =======================================================================
# SpringDoc (OpenAPI) Configuration
# =======================================================================
springdoc.api-docs.title=Distributed Systems Simulator API
springdoc.api-docs.description=API documentation for the Distributed Systems Simulator backend.
springdoc.api-docs.version=1.0.0

# =======================================================================
# Actuator (health checks for container/k8s liveness & readiness probes)
# =======================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true