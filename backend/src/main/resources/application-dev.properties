# =======================================================================
# 'dev' profile overrides
# =======================================================================
# Activate with SPRING_PROFILES_ACTIVE=dev (or --spring.profiles.active=dev)
# for local development, manual testing, and the test classpath. These
# insecure defaults must never be active in production.

# Disables security checks so local REST/WebSocket calls don't need auth.
app.security.disable=true

# Fallback signing key so the app doesn't require an externally-set
# JWT_SECRET just to boot locally.
app.jwt.secret=${JWT_SECRET:TestSecretKeyForTestsOnly}
