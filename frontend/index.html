<!DOCTYPE html>

    <!-- sockjs-client is a CommonJS module that references the Node `global`, which
         Create React App's webpack used to polyfill. Vite doesn't, so alias it to the
         window here before any module loads, or SockJS throws "global is not defined". -->
    <script>
      window.global = window;
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
