# nginx config for the production frontend container.
#
# The CRA dev-server "proxy" field only works under `npm start`; in the built
# container there is no dev server, so nginx must reverse-proxy the backend itself.
# "backend" resolves to the backend service on the Docker Compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API -> backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SockJS/STOMP WebSocket handshake + fallbacks -> backend. Requires the
    # Upgrade/Connection headers so the WebSocket transport can be established.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA routing: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
